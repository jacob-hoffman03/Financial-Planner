<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090b">
<title>Motion</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1114; --card:#1a1d22; --card2:#22262d; --line:rgba(255,255,255,.08);
  --txt:#f2f4f3; --mut:#9aa3ab; --green:#34d17b; --green-deep:#1f9d57;
  --blue:#2f7cf6; --red:#f2707a; --amber:#e0a92e;
}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt);
  padding-bottom:calc(108px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:430px;margin:0 auto;padding:0 16px;}
.tab{display:none;} .tab.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* header */
.dtop{display:flex;justify-content:space-between;align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 2px 14px;}
.hi{font-size:21px;font-weight:800;letter-spacing:-.4px;}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px;}
.dtop-btns{display:flex;gap:10px;}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.iconbtn svg{width:19px;height:19px;color:var(--txt);}

/* cards */
.dcard{background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);}
.dcard-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.dt{font-size:14.5px;font-weight:800;letter-spacing:-.2px;}
.ds{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45;}
.bignum{font-size:38px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 4px;font-variant-numeric:tabular-nums;}
.bignum.neg{color:var(--red);}
.bignum .cents{font-size:19px;color:var(--mut);font-weight:700;}

/* pills + links */
.pill{display:inline-block;font-size:11px;font-weight:800;padding:6px 12px;border-radius:99px;white-space:nowrap;}
.pill.green{background:rgba(52,209,123,.14);color:var(--green);}
.pill.blue{background:rgba(47,124,246,.15);color:#6ea8ff;}
.pill.dim{background:rgba(255,255,255,.07);color:var(--mut);}
.pill.red{background:rgba(242,112,122,.13);color:var(--red);}
.link{background:none;border:none;color:#6ea8ff;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);font-weight:600;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

/* kv rows + bars */
.kv2{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:7px 0;}
.kv2 span{color:var(--mut);} .kv2 b{font-variant-numeric:tabular-nums;}
.hbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin:10px 0 4px;overflow:hidden;}
.hbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),var(--green));}
.savebar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0;overflow:hidden;}
.savebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),var(--green));
  box-shadow:0 0 12px rgba(52,209,123,.5);}

/* gauge */
.gauge-wrap{position:relative;margin:4px 0;}
.gauge-wrap svg{width:100%;height:auto;display:block;}
.gauge-c{position:absolute;left:0;right:0;bottom:6px;text-align:center;}
.glabel{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--mut);}
.gval{font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums;}
.gsub{font-size:12px;color:var(--mut);}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.split2>div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:15px;padding:12px 14px;}
.sval{font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}

/* section heads + txn rows */
.dhead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 2px;}
.dhead h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px;}
.txn{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.txn:last-child{border-bottom:none;}
.ti{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(52,209,123,.13);}
.tn{font-size:14.5px;font-weight:700;}
.ts{font-size:11.5px;color:var(--mut);margin-top:2px;}
.ta{margin-left:auto;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.ta.out{color:var(--txt);} .ta.in{color:var(--green);}
.ti svg{width:21px;height:21px;color:var(--green);display:block;}

/* segmented */
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;}
.seg button{border:none;background:none;color:var(--mut);font-size:13px;font-weight:700;padding:8px 18px;border-radius:99px;cursor:pointer;}
.seg button.on{background:var(--green);color:#06130c;}

/* in / out cards */
.io2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.io{border-radius:16px;padding:13px 14px;border:1px solid var(--line);}
.io.in{background:rgba(52,209,123,.08);} .io.out{background:rgba(47,124,246,.08);}
.dt2{font-size:11.5px;color:var(--mut);font-weight:700;}
.iov{font-size:19px;font-weight:800;margin:4px 0 2px;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
.io.in .iov{color:var(--green);} .io.out .iov{color:#6ea8ff;}

/* bank cards (ref-3 style) */
.bank{background:linear-gradient(160deg,#232830,#191d23);border:1px solid var(--line);
  border-radius:20px;padding:17px 18px;margin-top:12px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);}
.bank.red{background:linear-gradient(160deg,#2b2126,#1c1518);}
.blabel{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--mut);}
.btop{display:flex;justify-content:space-between;align-items:center;}
.bpill{font-size:10px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(52,209,123,.14);color:var(--green);white-space:nowrap;}
.bpill.blue{background:rgba(47,124,246,.16);color:#6ea8ff;}
.bpill.red{background:rgba(242,112,122,.14);color:var(--red);}
.bname{font-size:15.5px;font-weight:700;margin-top:12px;}
.bmask{color:var(--mut);font-weight:600;font-size:13px;margin-left:8px;letter-spacing:2px;}
.bbal{font-size:31px;font-weight:800;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;}
.bbal.neg{color:var(--red);}
.bmeta{font-size:11.5px;color:var(--mut);margin-top:6px;}

/* bills / ytd */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--mut);} .kv .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(18,20,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;border:none;background:none;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;}
.tabbar .gi{width:46px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;}
.tabbar button.on{color:var(--txt);}
.tabbar button.on .gi{background:var(--green);}
.tabbar button.on .gi svg{color:#06130c;}
.gi svg{width:20px;height:20px;color:var(--mut);display:block;}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:430px;margin:0 auto;
  background:#20242b;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.9,.35,1);}
.sheet.show{transform:none;}
.grab{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:2px auto 12px;cursor:pointer;}
.sheet h3{margin:4px 0 2px;font-size:19px;font-weight:800;letter-spacing:-.4px;}
.ssub{font-size:12.5px;color:var(--mut);margin:0 0 10px;}
.bigbtn{width:100%;border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
.btn-green{background:var(--green);color:#06130c;}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--txt);}
.alert{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);}
.adot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
.at{font-size:14px;font-weight:800;} .as{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45;}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;font-weight:700;}
.mrow:last-child{border-bottom:none;}
.mrow .mi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none;}
.mrow .mi svg{width:19px;height:19px;color:var(--txt);display:block;}
.mrow .ms{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:2px;}
.mrow .chev{margin-left:auto;color:var(--mut);font-size:17px;}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#262b33;border:1px solid var(--line);color:var(--txt);font-size:13.5px;font-weight:600;
  padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%);}

.footnote{font-size:11.5px;color:var(--mut);margin:14px 4px 6px;line-height:1.5;}
svg text{font-family:inherit;}
/* ===== ref-dashboard additions ===== */
.drow{display:flex;align-items:center;gap:12px;}
.kebab{color:var(--mut);display:flex;cursor:pointer;}
.kebab svg{width:16px;height:16px;}
.chips{display:flex;gap:10px;margin:10px 0 6px;}
.chip{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0;}
.circbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;flex:none;}
.circbtn svg{width:17px;height:17px;color:var(--txt);}
.clabel{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--mut);}
.cval{font-size:16px;font-weight:800;letter-spacing:-.3px;font-variant-numeric:tabular-nums;margin-top:2px;}
.chip .pill{margin-left:auto;}
.iconbtn.sm{width:36px;height:36px;}
.iconbtn.sm svg{width:17px;height:17px;}
.ctabs{display:flex;gap:18px;margin:10px 0 4px;}
.ctabs button{background:none;border:none;color:var(--mut);font-size:13.5px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;gap:3px;padding:4px 0;}
.ctabs button.on{color:var(--green);font-weight:800;}
.ctabs button svg{width:14px;height:14px;}
.cfbot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;}
.cfbig{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:2px;font-variant-numeric:tabular-nums;}
.connrow{display:flex;justify-content:space-between;margin:6px 0 12px;}
.connbig{font-size:27px;font-weight:800;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums;}
.connbar{height:11px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
.connfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),var(--green));
  box-shadow:0 0 12px rgba(52,209,123,.5);}
.segs{display:flex;gap:8px;margin-top:10px;}
.segs span{flex:1;height:11px;border-radius:7px;background:rgba(255,255,255,.07);}
.minigrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.mini{margin-top:0 !important;padding:15px;}
.mini-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.pulse{width:38px;height:38px;border-radius:50%;background:var(--green);
  display:flex;align-items:center;justify-content:center;flex:none;}
.pulse svg{width:19px;height:19px;color:#06130c;}
.insight{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);
  font-size:11.5px;font-weight:700;border-radius:99px;padding:7px 12px;cursor:pointer;white-space:nowrap;}
.insight span{color:var(--mut);margin-left:2px;}
.minival{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:2px 0;font-variant-numeric:tabular-nums;}
.minisub{font-size:11.5px;font-weight:700;color:var(--green);}
.minispark{margin-top:8px;opacity:.9;}
.ti.blue svg{color:#6ea8ff;}

/* ===== single-page premium ===== */
.single{padding-bottom:24px;}
.single .dtop{margin-bottom:2px;}
.plat-wrap{perspective:1100px;margin-top:14px;}
.plat{position:relative;border-radius:22px;padding:20px 20px 18px;overflow:hidden;color:#14171b;
  background:
    radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.85),transparent 50%),
    linear-gradient(135deg,#f4f5f7 0%,#c7cbd2 26%,#eef0f3 48%,#b7bcc5 70%,#e8eaee 100%);
  box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.7);
  transform-style:preserve-3d;transition:transform .3s ease;will-change:transform;}
.plat::after{content:'';position:absolute;top:-20%;bottom:-20%;left:0;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  transform:translateX(-260%) skewX(-12deg);animation:glint 6s ease-in-out infinite;pointer-events:none;}
@keyframes glint{0%,58%{transform:translateX(-260%) skewX(-12deg);}92%,100%{transform:translateX(560%) skewX(-12deg);}}
.plat-top{display:flex;justify-content:space-between;align-items:center;}
.plat-bank{font-size:11px;font-weight:800;letter-spacing:2.5px;color:rgba(20,23,27,.62);}
.plat-chip{width:40px;height:30px;color:rgba(20,23,27,.75);}
.plat-chip svg{width:100%;height:100%;}
.plat-label{margin-top:16px;font-size:10px;font-weight:800;letter-spacing:2.5px;color:rgba(20,23,27,.55);}
.plat-total{font-size:40px;font-weight:800;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;margin-top:2px;}
.plat-accts{margin-top:14px;border-top:1px solid rgba(20,23,27,.14);padding-top:10px;display:grid;gap:7px;}
.plat-acct{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(20,23,27,.72);}
.plat-acct b{font-variant-numeric:tabular-nums;color:#14171b;}
.plat-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.plat-word{font-size:13px;font-weight:800;letter-spacing:4px;color:rgba(20,23,27,.5);}
.plat-type{font-size:10px;font-weight:800;letter-spacing:2.5px;color:rgba(20,23,27,.5);}
.gn2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.gn{margin-top:0 !important;}
.gnval{font-size:27px;font-weight:800;letter-spacing:-.6px;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
.debtline{text-align:center;font-size:11.5px;color:var(--mut);margin-top:10px;}
.bills-head{display:flex;align-items:center;gap:13px;width:100%;background:none;border:none;
  color:var(--txt);padding:16px;cursor:pointer;text-align:left;}
.fileic{width:44px;height:44px;border-radius:14px;background:rgba(47,124,246,.14);color:#6ea8ff;
  display:flex;align-items:center;justify-content:center;flex:none;}
.fileic svg{width:22px;height:22px;}
.bills-title{flex:1;display:flex;flex-direction:column;gap:2px;}
.bills-total{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
.bchev{color:var(--mut);display:flex;transition:transform .25s ease;}
.bchev svg{width:18px;height:18px;}
.bchev.open{transform:rotate(180deg);}
.bills-list{padding:2px 16px 14px;animation:drop .25s ease;}
@keyframes drop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
.bills-sum{border-top:1px solid var(--line);margin-top:4px;padding-top:12px;}
.bills-sum .v{color:var(--green);}
.plan-group{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--mut);margin:12px 0 2px;}

/* ===== Motion wallet ===== */
.wstack{position:relative;height:calc((100vw - 40px)/1.586 + 92px);margin-top:14px;}
.wcard{position:absolute;left:0;right:0;aspect-ratio:1.586/1;cursor:pointer;
  transition:bottom .38s cubic-bezier(.32,.72,.28,1);perspective:1200px;}
.wflip{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.32,.72,.28,1);}
.wcard.flipped .wflip{transform:rotateY(180deg);}
.wface{position:absolute;inset:0;border-radius:18px;padding:13px 16px;overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.35);}
.wface.wback{transform:rotateY(180deg);}
.wface.wfront{display:flex;flex-direction:column;}
.wc-top{display:flex;justify-content:space-between;align-items:center;}
.wc-name{font-size:11.5px;font-weight:800;letter-spacing:1.8px;}
.wc-amt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
.wc-chip{width:34px;height:26px;opacity:.8;}
.wc-chip svg{width:100%;height:100%;}
.wc-big{font-size:36px;font-weight:800;letter-spacing:-1px;margin-top:12px;font-variant-numeric:tabular-nums;}
.wc-sub{font-size:11.5px;opacity:.62;margin-top:3px;}
.wc-foot{margin-top:auto;display:flex;justify-content:flex-end;}
.wc-word{font-size:11px;font-weight:800;letter-spacing:5px;opacity:.45;}
.wrows{margin-top:8px;}
.wrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;
  padding:5px 0;border-top:1px solid rgba(0,0,0,.1);}
.wrow b{font-weight:800;font-variant-numeric:tabular-nums;}
.t-plat{background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.85),transparent 50%),linear-gradient(135deg,#f4f5f7 0%,#c7cbd2 26%,#eef0f3 48%,#b7bcc5 70%,#e8eaee 100%);color:#14171b;}
.t-silver{background:linear-gradient(135deg,#eef1f5,#c3c9d4 40%,#f5f7fa 60%,#a9b0bd);color:#14171b;}
.t-gold{background:linear-gradient(135deg,#f7e08a,#d4af37 35%,#f9ecb8 55%,#b8912f);color:#1a1405;}
.t-bronze{background:linear-gradient(135deg,#eec39a,#b0703a 35%,#f4d8b0 55%,#8f5a2b);color:#241708;}
.wcard.front .wfront::after{content:'';position:absolute;top:-20%;bottom:-20%;left:0;width:45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-260%) skewX(-12deg);animation:glint 6s ease-in-out infinite;pointer-events:none;}

/* ===== top bar ===== */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 0 2px;}
.tb-left{display:flex;align-items:center;gap:9px;}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,#f4f5f7,#aeb4bf);color:#14171b;
  display:flex;align-items:center;justify-content:center;
