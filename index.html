*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1114; --card:#1a1d22; --card2:#22262d; --line:rgba(255,255,255,.08);
  --txt:#f2f4f3; --mut:#9aa3ab; --green:#34d17b; --green-deep:#1f9d57;
  --blue:#2f7cf6; --red:#f2707a; --amber:#e0a92e;
}
html,body{margin:0;padding:0;}
body{
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt);
  padding-top:14px;
  padding-bottom:calc(108px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:430px;margin:0 auto;padding:0 16px;}
.tab{display:none;} .tab.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* header */
.dtop{display:flex;justify-content:space-between;align-items:center;
  padding:calc(16px + env(safe-area-inset-top)) 2px 14px;}
.hi{font-size:21px;font-weight:800;letter-spacing:-.4px;}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px;}
.dtop-btns{display:flex;gap:10px;}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.iconbtn svg{width:19px;height:19px;color:var(--txt);}

/* cards */
.dcard{background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);}
.dcard-h{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.dt{font-size:14.5px;font-weight:800;letter-spacing:-.2px;}
.ds{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.45;}
.bignum{font-size:38px;font-weight:800;letter-spacing:-1.2px;margin:8px 0 4px;font-variant-numeric:tabular-nums;}
.bignum.neg{color:var(--red);}
.bignum .cents{font-size:19px;color:var(--mut);font-weight:700;}

/* pills + links */
.pill{display:inline-block;font-size:11px;font-weight:800;padding:6px 12px;border-radius:99px;white-space:nowrap;}
.pill.green{background:rgba(52,209,123,.14);color:var(--green);}
.pill.blue{background:rgba(47,124,246,.15);color:#6ea8ff;}
.pill.dim{background:rgba(255,255,255,.07);color:var(--mut);}
.pill.red{background:rgba(242,112,122,.13);color:var(--red);}
.link{background:none;border:none;color:#6ea8ff;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);font-weight:600;}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}

/* kv rows + bars */
.kv2{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:7px 0;}
.kv2 span{color:var(--mut);} .kv2 b{font-variant-numeric:tabular-nums;}
.hbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);margin:10px 0 4px;overflow:hidden;}
.hbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),var(--green));}
.savebar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);margin:12px 0;overflow:hidden;}
.savebar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),var(--green));
  box-shadow:0 0 12px rgba(52,209,123,.5);}

/* gauge */
.gauge-wrap{position:relative;margin:4px 0;}
.gauge-wrap svg{width:100%;height:auto;display:block;}
.gauge-c{position:absolute;left:0;right:0;bottom:6px;text-align:center;}
.glabel{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--mut);}
.gval{font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0;font-variant-numeric:tabular-nums;}
.gsub{font-size:12px;color:var(--mut);}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.split2>div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:15px;padding:12px 14px;}
.sval{font-size:20px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}

/* section heads + txn rows */
.dhead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 2px;}
.dhead h3{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.3px;}
.txn{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.txn:last-child{border-bottom:none;}
.ti{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(52,209,123,.13);}
.tn{font-size:14.5px;font-weight:700;}
.ts{font-size:11.5px;color:var(--mut);margin-top:2px;}
.ta{margin-left:auto;font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;}
.ta.out{color:var(--txt);} .ta.in{color:var(--green);}
.ti svg{width:21px;height:21px;color:var(--green);display:block;}

/* segmented */
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;}
.seg button{border:none;background:none;color:var(--mut);font-size:13px;font-weight:700;padding:8px 18px;border-radius:99px;cursor:pointer;}
.seg button.on{background:var(--green);color:#06130c;}

/* in / out cards */
.io2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.io{border-radius:16px;padding:13px 14px;border:1px solid var(--line);}
.io.in{background:rgba(52,209,123,.08);} .io.out{background:rgba(47,124,246,.08);}
.dt2{font-size:11.5px;color:var(--mut);font-weight:700;}
.iov{font-size:19px;font-weight:800;margin:4px 0 2px;letter-spacing:-.4px;font-variant-numeric:tabular-nums;}
.io.in .iov{color:var(--green);} .io.out .iov{color:#6ea8ff;}

/* bank cards (ref-3 style) */
.bank{background:linear-gradient(160deg,#232830,#191d23);border:1px solid var(--line);
  border-radius:20px;padding:17px 18px;margin-top:12px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.35);}
.bank.red{background:linear-gradient(160deg,#2b2126,#1c1518);}
.blabel{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--mut);}
.btop{display:flex;justify-content:space-between;align-items:center;}
.bpill{font-size:10px;font-weight:800;padding:5px 10px;border-radius:99px;background:rgba(52,209,123,.14);color:var(--green);white-space:nowrap;}
.bpill.blue{background:rgba(47,124,246,.16);color:#6ea8ff;}
.bpill.red{background:rgba(242,112,122,.14);color:var(--red);}
.bname{font-size:15.5px;font-weight:700;margin-top:12px;}
.bmask{color:var(--mut);font-weight:600;font-size:13px;margin-left:8px;letter-spacing:2px;}
.bbal{font-size:31px;font-weight:800;letter-spacing:-.8px;margin-top:8px;font-variant-numeric:tabular-nums;}
.bbal.neg{color:var(--red);}
.bmeta{font-size:11.5px;color:var(--mut);margin-top:6px;}

/* bills / ytd */
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--mut);} .kv .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(18,20,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;border:none;background:none;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;}
.tabbar .gi{width:46px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;}
.tabbar button.on{color:var(--txt);}
.tabbar button.on .gi{background:var(--green);}
.tabbar button.on .gi svg{color:#06130c;}
.gi svg{width:20px;height:20px;color:var(--mut);display:block;}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:430px;margin:0 auto;
  background:#20242b;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:none;
  padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:82vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.9,.35,1);}
.sheet.show{transform:none;}
.grab{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);margin:2px auto 12px;cursor:pointer;}
.sheet-title{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.sheet h3{margin:4px 0 2px;font-size:19px;font-weight:800;letter-spacing:-.4px;}
.ssub{font-size:12.5px;color:var(--mut);margin:0 0 10px;}
.bigbtn{width:100%;border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;}
.btn-green{background:var(--green);color:#06130c;}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--txt);}
.alert{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);}
.adot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
.at{font-size:14px;font-weight:800;} .as{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.45;}
.mrow{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;font-weight:700;}
.mrow:last-child{border-bottom:none;}
.mrow .mi{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex:none;}
